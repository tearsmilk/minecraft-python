[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "honoka"
version = "0.1.0"
description = "Лаунчер сервера Hoka: запускает Horizon сразу на сервере"
readme = "README.md"
requires-python = ">=3.9"
# Только стандартная библиотека Python: tkinter, urllib, ctypes.
dependencies = []

[project.scripts]
honoka = "honoka.cli:main"

[project.gui-scripts]
honoka-gui = "honoka.gui:main"

[tool.setuptools]
packages = ["honoka"]
